<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>西藏自治区 昌都市 足球选拔赛</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-tibetan/index.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="app-title">
      <span class="app-emoji">⚽</span>
      <div>
        <h1>昌都市第二届全民运动会</h1>
        <p class="app-sub" id="appSub">暨西藏自治区第十四届运动会十一人制男子足球选拔赛</p>
      </div>
    </div>
    <div class="app-actions">
      <button class="btn-icon" id="quickAddBtn" title="快速录入">＋</button>
    </div>
  </header>

  <div class="sponsor-strip" id="sponsorStrip" hidden></div>

  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="today">今日</button>
    <button class="tab-btn" data-tab="schedule">赛程</button>
    <button class="tab-btn" data-tab="bracket">对战图</button>
    <button class="tab-btn" data-tab="teams">队伍</button>
    <button class="tab-btn" data-tab="players">球员</button>
    <button class="tab-btn" data-tab="standings">积分榜</button>
    <button class="tab-btn" data-tab="topscorers">射手榜</button>
    <button class="tab-btn" data-tab="discipline">风纪</button>
    <button class="tab-btn" data-tab="reports">战报</button>
    <button class="tab-btn" data-tab="regulations">规程</button>
    <button class="tab-btn" data-tab="data">数据</button>
  </nav>

  <main class="app-main">
    <section id="tab-today" class="tab-panel active"></section>
    <section id="tab-schedule" class="tab-panel"></section>
    <section id="tab-bracket" class="tab-panel"></section>
    <section id="tab-teams" class="tab-panel"></section>
    <section id="tab-players" class="tab-panel"></section>
    <section id="tab-standings" class="tab-panel"></section>
    <section id="tab-topscorers" class="tab-panel"></section>
    <section id="tab-discipline" class="tab-panel"></section>
    <section id="tab-reports" class="tab-panel"></section>
    <section id="tab-regulations" class="tab-panel"></section>
    <section id="tab-data" class="tab-panel"></section>
  </main>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal-card">
      <header class="modal-header">
        <h2 id="modalTitle">标题</h2>
        <button class="btn-icon" id="modalClose" type="button">×</button>
      </header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json" hidden />

  <script src="script.js"></script>
</body>
</html>
